<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 45 45" width="100%" height="100%">

  <defs>
    <!-- Black / Dark Walnut / Ebony gradients -->
    <radialGradient id="b-wood-rad" cx="35%" cy="25%" r="80%">
      <stop offset="0%" stop-color="#735d4d"/>
      <stop offset="25%" stop-color="#4f3e33"/>
      <stop offset="65%" stop-color="#31251e"/>
      <stop offset="90%" stop-color="#1d1511"/>
      <stop offset="100%" stop-color="#0d0907"/>
    </radialGradient>
    <linearGradient id="b-wood-vert" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#917763" stop-opacity="0.85"/>
      <stop offset="20%" stop-color="#634f40" stop-opacity="0.4"/>
      <stop offset="70%" stop-color="#241a14" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#050302" stop-opacity="0.85"/>
    </linearGradient>
    <linearGradient id="b-sheen" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#ab907a" stop-opacity="0.9"/>
      <stop offset="45%" stop-color="#4a392e" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.8"/>
    </linearGradient>
    <!-- Drop shadow for 3D grounding -->
    <filter id="p-shadow" x="-30%" y="-15%" width="160%" height="150%">
      <feDropShadow dx="0" dy="3.5" stdDeviation="2.2" flood-color="#0a0705" flood-opacity="0.6"/>
      <feDropShadow dx="0" dy="1.2" stdDeviation="1" flood-color="#1c120c" flood-opacity="0.4"/>
    </filter>
  </defs>

  <g filter="url(#p-shadow)">
    
    <!-- Base pedestal -->
    <path d="M 10 39.5 h 25 v -3 H 10 v 3 z" fill="url(#b-wood-rad)" stroke="#18100b" stroke-width="1.3" stroke-linejoin="round"/>
    <!-- Mitre Body -->
    <path d="M 9 36 C 12 39 22 39 24 36 C 27 39 33 39 36 36 C 36 32 30 27 30 21 C 30 16 33 12 33 9 C 30 6 27 6 24 9 C 21 6 18 6 15 9 C 15 12 18 16 18 21 C 18 27 12 32 12 36 Z" fill="url(#b-wood-rad)" stroke="#18100b" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 9 36 C 12 39 22 39 24 36 C 27 39 33 39 36 36 C 36 32 30 27 30 21 C 30 16 33 12 33 9 C 30 6 27 6 24 9 C 21 6 18 6 15 9 C 15 12 18 16 18 21 C 18 27 12 32 12 36 Z" fill="url(#b-wood-vert)" opacity="0.5"/>
    <!-- Finial ball on top -->
    <circle cx="24" cy="5.5" r="2.2" fill="url(#b-wood-rad)" stroke="#18100b" stroke-width="1"/>
    <circle cx="23.2" cy="4.8" r="0.7" fill="#ffffff" opacity="0.3"/>
    <!-- Mitre slit / cut -->
    <path d="M 21.5 12 L 27.5 17" stroke="#18100b" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M 21.5 12 L 27.5 17" stroke="#806856" stroke-width="0.6" stroke-linecap="round"/>
    <!-- Collars -->
    <path d="M 14.5 32 h 16" stroke="#806856" stroke-width="0.8" opacity="0.7"/>
    <path d="M 12 36 h 21" stroke="#806856" stroke-width="0.8" opacity="0.7"/>
    <!-- Specular highlight curve -->
    <path d="M 18 16 C 18 21 21 27 22 30" fill="none" stroke="#806856" stroke-width="1" opacity="0.3"/>
    
  </g>
</svg>