<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 45 45" width="100%" height="100%">

  <defs>
    <!-- Black / Dark Walnut / Ebony gradients -->
    <radialGradient id="b-wood-rad" cx="35%" cy="25%" r="80%">
      <stop offset="0%" stop-color="#735d4d"/>
      <stop offset="25%" stop-color="#4f3e33"/>
      <stop offset="65%" stop-color="#31251e"/>
      <stop offset="90%" stop-color="#1d1511"/>
      <stop offset="100%" stop-color="#0d0907"/>
    </radialGradient>
    <linearGradient id="b-wood-vert" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#917763" stop-opacity="0.85"/>
      <stop offset="20%" stop-color="#634f40" stop-opacity="0.4"/>
      <stop offset="70%" stop-color="#241a14" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#050302" stop-opacity="0.85"/>
    </linearGradient>
    <linearGradient id="b-sheen" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#ab907a" stop-opacity="0.9"/>
      <stop offset="45%" stop-color="#4a392e" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.8"/>
    </linearGradient>
    <!-- Drop shadow for 3D grounding -->
    <filter id="p-shadow" x="-30%" y="-15%" width="160%" height="150%">
      <feDropShadow dx="0" dy="3.5" stdDeviation="2.2" flood-color="#0a0705" flood-opacity="0.6"/>
      <feDropShadow dx="0" dy="1.2" stdDeviation="1" flood-color="#1c120c" flood-opacity="0.4"/>
    </filter>
  </defs>

  <g filter="url(#p-shadow)">
    
    <!-- Cross finial -->
    <path d="M 22.5 4.5 L 22.5 11.5 M 19.5 7 L 25.5 7" stroke="#18100b" stroke-width="1.8" stroke-linecap="round"/>
    <path d="M 22.5 4.5 L 22.5 11.5 M 19.5 7 L 25.5 7" stroke="#806856" stroke-width="0.8" stroke-linecap="round"/>
    <!-- Dome cap -->
    <path d="M 22.5 25 C 27 17.5 25.5 14.5 25.5 14.5 C 25.5 14.5 24.5 12 22.5 12 C 20.5 12 19.5 14.5 19.5 14.5 C 19.5 14.5 18 17.5 22.5 25 Z" fill="url(#b-wood-rad)" stroke="#18100b" stroke-width="1.3" stroke-linejoin="round"/>
    <!-- Robe / Shoulders -->
    <path d="M 11.5 39 C 17 41.5 28 41.5 33.5 39 L 33.5 31 C 33.5 31 42.5 26.5 39.5 20.5 C 35.5 14 26 17 22.5 24.5 L 22.5 27 L 22.5 24.5 C 19 17 9.5 14 5.5 20.5 C 2.5 26.5 11.5 31 11.5 31 L 11.5 39 Z" fill="url(#b-wood-rad)" stroke="#18100b" stroke-width="1.3" stroke-linejoin="round"/>
    <path d="M 11.5 39 C 17 41.5 28 41.5 33.5 39 L 33.5 31 C 33.5 31 42.5 26.5 39.5 20.5 C 35.5 14 26 17 22.5 24.5 L 22.5 27 L 22.5 24.5 C 19 17 9.5 14 5.5 20.5 C 2.5 26.5 11.5 31 11.5 31 L 11.5 39 Z" fill="url(#b-wood-vert)" opacity="0.5"/>
    <!-- Collars -->
    <path d="M 12 32 C 17 29.5 28 29.5 33 32" fill="none" stroke="#806856" stroke-width="0.9" opacity="0.7"/>
    <path d="M 11.5 35.5 C 17 33.5 28 33.5 33.5 35.5" fill="none" stroke="#806856" stroke-width="0.8" opacity="0.6"/>
    <!-- Specular highlight on left shoulder -->
    <path d="M 12 22 C 14 21 19 25 21 28" fill="none" stroke="#806856" stroke-width="1" opacity="0.3"/>
    
  </g>
</svg>