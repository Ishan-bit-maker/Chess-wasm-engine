<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 45 45" width="100%" height="100%">

  <defs>
    <!-- Black / Dark Walnut / Ebony gradients -->
    <radialGradient id="b-wood-rad" cx="35%" cy="25%" r="80%">
      <stop offset="0%" stop-color="#735d4d"/>
      <stop offset="25%" stop-color="#4f3e33"/>
      <stop offset="65%" stop-color="#31251e"/>
      <stop offset="90%" stop-color="#1d1511"/>
      <stop offset="100%" stop-color="#0d0907"/>
    </radialGradient>
    <linearGradient id="b-wood-vert" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#917763" stop-opacity="0.85"/>
      <stop offset="20%" stop-color="#634f40" stop-opacity="0.4"/>
      <stop offset="70%" stop-color="#241a14" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#050302" stop-opacity="0.85"/>
    </linearGradient>
    <linearGradient id="b-sheen" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#ab907a" stop-opacity="0.9"/>
      <stop offset="45%" stop-color="#4a392e" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.8"/>
    </linearGradient>
    <!-- Drop shadow for 3D grounding -->
    <filter id="p-shadow" x="-30%" y="-15%" width="160%" height="150%">
      <feDropShadow dx="0" dy="3.5" stdDeviation="2.2" flood-color="#0a0705" flood-opacity="0.6"/>
      <feDropShadow dx="0" dy="1.2" stdDeviation="1" flood-color="#1c120c" flood-opacity="0.4"/>
    </filter>
  </defs>

  <g filter="url(#p-shadow)">
    
    <!-- Coronet spheres -->
    <circle cx="6" cy="12" r="2.2" fill="url(#b-wood-rad)" stroke="#18100b" stroke-width="0.9"/>
    <circle cx="14" cy="9" r="2.2" fill="url(#b-wood-rad)" stroke="#18100b" stroke-width="0.9"/>
    <circle cx="22.5" cy="8" r="2.5" fill="url(#b-wood-rad)" stroke="#18100b" stroke-width="0.9"/>
    <circle cx="31" cy="9" r="2.2" fill="url(#b-wood-rad)" stroke="#18100b" stroke-width="0.9"/>
    <circle cx="39" cy="12" r="2.2" fill="url(#b-wood-rad)" stroke="#18100b" stroke-width="0.9"/>
    
    <circle cx="22" cy="7.2" r="0.8" fill="#ffffff" opacity="0.3"/>
    
    <!-- Crown -->
    <path d="M 9 26 C 17.5 24.5 30 24.5 36 26 L 39 12.5 L 31.5 24.5 L 30.7 10 L 25.5 24 L 22.5 9 L 19.5 24 L 14.3 10 L 13.5 24.5 L 6 12.5 L 9 26 z" fill="url(#b-wood-rad)" stroke="#18100b" stroke-width="1.3" stroke-linejoin="round"/>
    <path d="M 9 26 C 9 28 10.5 28 11.5 30 C 12.5 31.5 12.5 31 12 33.5 C 10.5 34.5 10.5 36 10.5 36 C 9 37.5 11 39.5 11 39.5 C 17.5 40.5 27.5 40.5 34 39.5 C 34 39.5 36 37.5 34.5 36 C 34.5 36 34.5 34.5 33 33.5 C 32.5 31 32.5 31.5 33.5 30 C 34.5 28 36 28 36 26 z" fill="url(#b-wood-rad)" stroke="#18100b" stroke-width="1.3" stroke-linejoin="round"/>
    <path d="M 9 26 C 9 28 10.5 28 11.5 30 C 12.5 31.5 12.5 31 12 33.5 C 10.5 34.5 10.5 36 10.5 36 C 9 37.5 11 39.5 11 39.5 C 17.5 40.5 27.5 40.5 34 39.5 C 34 39.5 36 37.5 34.5 36 C 34.5 36 34.5 34.5 33 33.5 C 32.5 31 32.5 31.5 33.5 30 C 34.5 28 36 28 36 26 z" fill="url(#b-wood-vert)" opacity="0.5"/>
    <!-- Waistband rings -->
    <path d="M 11 29 C 18 27.5 27 27.5 34 29" fill="none" stroke="#806856" stroke-width="0.9" opacity="0.7"/>
    <path d="M 12 33.5 C 18 32.5 27 32.5 33 33.5" fill="none" stroke="#806856" stroke-width="0.8" opacity="0.6"/>
    <path d="M 11 37 C 18 36 27 36 34 37" fill="none" stroke="#806856" stroke-width="0.8" opacity="0.6"/>
    
  </g>
</svg>