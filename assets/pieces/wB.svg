<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 45 45" width="100%" height="100%">

  <defs>
    <!-- White / Boxwood gradients -->
    <radialGradient id="w-wood-rad" cx="35%" cy="28%" r="75%">
      <stop offset="0%" stop-color="#fff9f0"/>
      <stop offset="25%" stop-color="#eedfc9"/>
      <stop offset="60%" stop-color="#d4bfa5"/>
      <stop offset="85%" stop-color="#b69e80"/>
      <stop offset="100%" stop-color="#8a7055"/>
    </radialGradient>
    <linearGradient id="w-wood-vert" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="15%" stop-color="#fdf5ea" stop-opacity="0.5"/>
      <stop offset="70%" stop-color="#c4ac8f" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#6e553c" stop-opacity="0.7"/>
    </linearGradient>
    <linearGradient id="w-sheen" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.8"/>
      <stop offset="40%" stop-color="#f5e8d5" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#4a3622" stop-opacity="0.4"/>
    </linearGradient>
    <!-- Drop shadow for 3D grounding -->
    <filter id="p-shadow" x="-30%" y="-15%" width="160%" height="150%">
      <feDropShadow dx="0" dy="3.5" stdDeviation="2.2" flood-color="#0a0705" flood-opacity="0.6"/>
      <feDropShadow dx="0" dy="1.2" stdDeviation="1" flood-color="#1c120c" flood-opacity="0.4"/>
    </filter>
  </defs>

  <g filter="url(#p-shadow)">
    
    <!-- Base pedestal -->
    <path d="M 10 39.5 h 25 v -3 H 10 v 3 z" fill="url(#w-wood-rad)" stroke="#543e2a" stroke-width="1.3" stroke-linejoin="round"/>
    <!-- Mitre Body -->
    <path d="M 9 36 C 12 39 22 39 24 36 C 27 39 33 39 36 36 C 36 32 30 27 30 21 C 30 16 33 12 33 9 C 30 6 27 6 24 9 C 21 6 18 6 15 9 C 15 12 18 16 18 21 C 18 27 12 32 12 36 Z" fill="url(#w-wood-rad)" stroke="#543e2a" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 9 36 C 12 39 22 39 24 36 C 27 39 33 39 36 36 C 36 32 30 27 30 21 C 30 16 33 12 33 9 C 30 6 27 6 24 9 C 21 6 18 6 15 9 C 15 12 18 16 18 21 C 18 27 12 32 12 36 Z" fill="url(#w-wood-vert)" opacity="0.5"/>
    <!-- Finial ball on top -->
    <circle cx="24" cy="5.5" r="2.2" fill="url(#w-wood-rad)" stroke="#543e2a" stroke-width="1"/>
    <circle cx="23.2" cy="4.8" r="0.7" fill="#ffffff" opacity="0.6"/>
    <!-- Mitre slit / cut -->
    <path d="M 21.5 12 L 27.5 17" stroke="#543e2a" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M 21.5 12 L 27.5 17" stroke="#fff6ea" stroke-width="0.6" stroke-linecap="round"/>
    <!-- Collars -->
    <path d="M 14.5 32 h 16" stroke="#fff6ea" stroke-width="0.8" opacity="0.7"/>
    <path d="M 12 36 h 21" stroke="#fff6ea" stroke-width="0.8" opacity="0.7"/>
    <!-- Specular highlight curve -->
    <path d="M 18 16 C 18 21 21 27 22 30" fill="none" stroke="#fff6ea" stroke-width="1" opacity="0.6"/>
    
  </g>
</svg>