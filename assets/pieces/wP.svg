<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 45 45" width="100%" height="100%">

  <defs>
    <!-- White / Boxwood gradients -->
    <radialGradient id="w-wood-rad" cx="35%" cy="28%" r="75%">
      <stop offset="0%" stop-color="#fff9f0"/>
      <stop offset="25%" stop-color="#eedfc9"/>
      <stop offset="60%" stop-color="#d4bfa5"/>
      <stop offset="85%" stop-color="#b69e80"/>
      <stop offset="100%" stop-color="#8a7055"/>
    </radialGradient>
    <linearGradient id="w-wood-vert" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="15%" stop-color="#fdf5ea" stop-opacity="0.5"/>
      <stop offset="70%" stop-color="#c4ac8f" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#6e553c" stop-opacity="0.7"/>
    </linearGradient>
    <linearGradient id="w-sheen" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.8"/>
      <stop offset="40%" stop-color="#f5e8d5" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#4a3622" stop-opacity="0.4"/>
    </linearGradient>
    <!-- Drop shadow for 3D grounding -->
    <filter id="p-shadow" x="-30%" y="-15%" width="160%" height="150%">
      <feDropShadow dx="0" dy="3.5" stdDeviation="2.2" flood-color="#0a0705" flood-opacity="0.6"/>
      <feDropShadow dx="0" dy="1.2" stdDeviation="1" flood-color="#1c120c" flood-opacity="0.4"/>
    </filter>
  </defs>

  <g filter="url(#p-shadow)">
    
    <path d="M 22.5 9 c -2.21 0 -4 1.79 -4 4 c 0 0.89 0.29 1.71 0.78 2.38 C 17.33 16.5 16 18.59 16 21 c 0 2.03 0.94 3.84 2.41 5.03 C 15.41 27.09 11 31.58 11 39.5 h 23 c 0 -7.92 -4.41 -12.41 -7.41 -13.47 c 1.47 -1.19 2.41 -3 2.41 -5.03 c 0 -2.41 -1.33 -4.5 -2.78 -5.62 c 0.49 -0.67 0.78 -1.49 0.78 -2.38 c 0 -2.21 -1.79 -4 -4 -4 z" fill="url(#w-wood-rad)" stroke="#543e2a" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 22.5 9 c -2.21 0 -4 1.79 -4 4 c 0 0.89 0.29 1.71 0.78 2.38 C 17.33 16.5 16 18.59 16 21 c 0 2.03 0.94 3.84 2.41 5.03 C 15.41 27.09 11 31.58 11 39.5 h 23 c 0 -7.92 -4.41 -12.41 -7.41 -13.47 c 1.47 -1.19 2.41 -3 2.41 -5.03 c 0 -2.41 -1.33 -4.5 -2.78 -5.62 c 0.49 -0.67 0.78 -1.49 0.78 -2.38 c 0 -2.21 -1.79 -4 -4 -4 z" fill="url(#w-wood-vert)" opacity="0.6"/>
    <!-- Collar ring accent -->
    <ellipse cx="22.5" cy="26" rx="4.5" ry="1.2" fill="none" stroke="#fff6ea" stroke-width="0.8" opacity="0.7"/>
    <!-- Head specular gloss -->
    <ellipse cx="21" cy="11.5" rx="2.2" ry="1.4" fill="#ffffff" opacity="0.55"/>
    <!-- Base rim -->
    <path d="M 12 39.5 h 21" stroke="#fff6ea" stroke-width="0.9" opacity="0.6"/>
    
  </g>
</svg>