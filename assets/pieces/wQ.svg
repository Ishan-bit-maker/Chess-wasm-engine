<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 45 45" width="100%" height="100%">

  <defs>
    <!-- White / Boxwood gradients -->
    <radialGradient id="w-wood-rad" cx="35%" cy="28%" r="75%">
      <stop offset="0%" stop-color="#fff9f0"/>
      <stop offset="25%" stop-color="#eedfc9"/>
      <stop offset="60%" stop-color="#d4bfa5"/>
      <stop offset="85%" stop-color="#b69e80"/>
      <stop offset="100%" stop-color="#8a7055"/>
    </radialGradient>
    <linearGradient id="w-wood-vert" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="15%" stop-color="#fdf5ea" stop-opacity="0.5"/>
      <stop offset="70%" stop-color="#c4ac8f" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#6e553c" stop-opacity="0.7"/>
    </linearGradient>
    <linearGradient id="w-sheen" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.8"/>
      <stop offset="40%" stop-color="#f5e8d5" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#4a3622" stop-opacity="0.4"/>
    </linearGradient>
    <!-- Drop shadow for 3D grounding -->
    <filter id="p-shadow" x="-30%" y="-15%" width="160%" height="150%">
      <feDropShadow dx="0" dy="3.5" stdDeviation="2.2" flood-color="#0a0705" flood-opacity="0.6"/>
      <feDropShadow dx="0" dy="1.2" stdDeviation="1" flood-color="#1c120c" flood-opacity="0.4"/>
    </filter>
  </defs>

  <g filter="url(#p-shadow)">
    
    <!-- Coronet spheres -->
    <circle cx="6" cy="12" r="2.2" fill="url(#w-wood-rad)" stroke="#543e2a" stroke-width="0.9"/>
    <circle cx="14" cy="9" r="2.2" fill="url(#w-wood-rad)" stroke="#543e2a" stroke-width="0.9"/>
    <circle cx="22.5" cy="8" r="2.5" fill="url(#w-wood-rad)" stroke="#543e2a" stroke-width="0.9"/>
    <circle cx="31" cy="9" r="2.2" fill="url(#w-wood-rad)" stroke="#543e2a" stroke-width="0.9"/>
    <circle cx="39" cy="12" r="2.2" fill="url(#w-wood-rad)" stroke="#543e2a" stroke-width="0.9"/>
    
    <circle cx="22" cy="7.2" r="0.8" fill="#ffffff" opacity="0.6"/>
    
    <!-- Crown -->
    <path d="M 9 26 C 17.5 24.5 30 24.5 36 26 L 39 12.5 L 31.5 24.5 L 30.7 10 L 25.5 24 L 22.5 9 L 19.5 24 L 14.3 10 L 13.5 24.5 L 6 12.5 L 9 26 z" fill="url(#w-wood-rad)" stroke="#543e2a" stroke-width="1.3" stroke-linejoin="round"/>
    <path d="M 9 26 C 9 28 10.5 28 11.5 30 C 12.5 31.5 12.5 31 12 33.5 C 10.5 34.5 10.5 36 10.5 36 C 9 37.5 11 39.5 11 39.5 C 17.5 40.5 27.5 40.5 34 39.5 C 34 39.5 36 37.5 34.5 36 C 34.5 36 34.5 34.5 33 33.5 C 32.5 31 32.5 31.5 33.5 30 C 34.5 28 36 28 36 26 z" fill="url(#w-wood-rad)" stroke="#543e2a" stroke-width="1.3" stroke-linejoin="round"/>
    <path d="M 9 26 C 9 28 10.5 28 11.5 30 C 12.5 31.5 12.5 31 12 33.5 C 10.5 34.5 10.5 36 10.5 36 C 9 37.5 11 39.5 11 39.5 C 17.5 40.5 27.5 40.5 34 39.5 C 34 39.5 36 37.5 34.5 36 C 34.5 36 34.5 34.5 33 33.5 C 32.5 31 32.5 31.5 33.5 30 C 34.5 28 36 28 36 26 z" fill="url(#w-wood-vert)" opacity="0.5"/>
    <!-- Waistband rings -->
    <path d="M 11 29 C 18 27.5 27 27.5 34 29" fill="none" stroke="#fff6ea" stroke-width="0.9" opacity="0.7"/>
    <path d="M 12 33.5 C 18 32.5 27 32.5 33 33.5" fill="none" stroke="#fff6ea" stroke-width="0.8" opacity="0.6"/>
    <path d="M 11 37 C 18 36 27 36 34 37" fill="none" stroke="#fff6ea" stroke-width="0.8" opacity="0.6"/>
    
  </g>
</svg>