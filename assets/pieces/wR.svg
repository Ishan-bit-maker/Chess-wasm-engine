<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 45 45" width="100%" height="100%">

  <defs>
    <!-- White / Boxwood gradients -->
    <radialGradient id="w-wood-rad" cx="35%" cy="28%" r="75%">
      <stop offset="0%" stop-color="#fff9f0"/>
      <stop offset="25%" stop-color="#eedfc9"/>
      <stop offset="60%" stop-color="#d4bfa5"/>
      <stop offset="85%" stop-color="#b69e80"/>
      <stop offset="100%" stop-color="#8a7055"/>
    </radialGradient>
    <linearGradient id="w-wood-vert" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="15%" stop-color="#fdf5ea" stop-opacity="0.5"/>
      <stop offset="70%" stop-color="#c4ac8f" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#6e553c" stop-opacity="0.7"/>
    </linearGradient>
    <linearGradient id="w-sheen" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.8"/>
      <stop offset="40%" stop-color="#f5e8d5" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#4a3622" stop-opacity="0.4"/>
    </linearGradient>
    <!-- Drop shadow for 3D grounding -->
    <filter id="p-shadow" x="-30%" y="-15%" width="160%" height="150%">
      <feDropShadow dx="0" dy="3.5" stdDeviation="2.2" flood-color="#0a0705" flood-opacity="0.6"/>
      <feDropShadow dx="0" dy="1.2" stdDeviation="1" flood-color="#1c120c" flood-opacity="0.4"/>
    </filter>
  </defs>

  <g filter="url(#p-shadow)">
    
    <!-- Base rim -->
    <path d="M 9 39.5 h 27 v -3 H 9 v 3 z" fill="url(#w-wood-rad)" stroke="#543e2a" stroke-width="1.3" stroke-linejoin="round"/>
    <!-- Pedestal step -->
    <path d="M 12 36.5 v -4 h 21 v 4 H 12 z" fill="url(#w-wood-rad)" stroke="#543e2a" stroke-width="1.2" stroke-linejoin="round"/>
    <!-- Tower shaft -->
    <path d="M 13.5 32.5 l 1.5 -16 h 15 l 1.5 16 H 13.5 z" fill="url(#w-wood-rad)" stroke="#543e2a" stroke-width="1.3" stroke-linejoin="round"/>
    <!-- Battlements -->
    <path d="M 11 16.5 v -7.5 h 4 v 3 h 5 v -3 h 5 v 3 h 5 v -3 h 4 v 7.5 H 11 z" fill="url(#w-wood-rad)" stroke="#543e2a" stroke-width="1.3" stroke-linejoin="round"/>
    <!-- Wood grain vertical overlay -->
    <rect x="9" y="9" width="27" height="30.5" fill="url(#w-wood-vert)" opacity="0.4" clip-path="url(#none)"/>
    <!-- Highlights -->
    <path d="M 15 16.5 h 15" stroke="#fff6ea" stroke-width="0.8" opacity="0.7"/>
    <path d="M 13.5 32.5 h 18" stroke="#fff6ea" stroke-width="0.8" opacity="0.7"/>
    <line x1="16" y1="18" x2="15.2" y2="31" stroke="#fff6ea" stroke-width="1" opacity="0.6"/>
    
  </g>
</svg>