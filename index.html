<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chess Engine</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Loading overlay — shown while WASM module is initialising -->
  <div id="loader">
    <div id="loader-box">
      <div id="spinner"></div>
      <p>Loading WebAssembly engine…</p>
    </div>
  </div>

  <div id="layout-container">
    
    <!-- LEFT: Board Area -->
    <div class="board-area">
      
      <!-- Opponent Banner -->
      <div class="player-banner top-banner">
        <div class="player-icon engine-avatar">
          <svg viewBox="0 0 48 48" aria-hidden="true">
            <path d="M12 39h27v-4c0-6-3-10-9-12l-5-2 4-4 1-7-4 3-4-7-5 6-6 3 3 6-4 7 2 11Z"/>
            <path d="m17 15 5-3 3 5-4 4-5-1M14 35h20" class="avatar-mark"/>
            <circle cx="27" cy="15" r="1.3" class="avatar-eye"/>
          </svg>
        </div>
        <div class="player-info">
          <span class="player-name">Engine</span>
          <span class="player-side">(Plays Black)</span>
        </div>
      </div>

      <!-- 3D Board + wooden frame wrapper -->
      <div class="board-wrapper">
        <div class="board-frame">
          <div id="board-outer">
            <!-- Rank labels (hidden in 3D mode, coords are on squares) -->
            <div id="ranks"></div>

            <!-- The actual chess board squares -->
            <div id="board"></div>
          </div>
        </div>
      </div>

      <!-- File labels (hidden in 3D mode) -->
      <div id="files"></div>

      <!-- Player Banner -->
      <div class="player-banner bottom-banner">
        <div class="player-icon user-avatar">
          <svg viewBox="0 0 48 48" aria-hidden="true">
            <circle cx="24" cy="17" r="8"/>
            <path d="M9 40c1-9 6-14 15-14s14 5 15 14H9Z"/>
          </svg>
        </div>
        <div class="player-info">
          <span class="player-name">Guest</span>
          <span class="player-side">(You play White)</span>
        </div>
      </div>
    </div>

    <!-- RIGHT: Sidebar Control Panel -->
    <div class="sidebar">
      
      <header>
        <h1>Chess Engine</h1>
        <p id="info">Engine vs You</p>
      </header>

      <div class="sidebar-content">
        <!-- Status bar -->
        <div id="status-container">
          <div id="status">Initialising…</div>
        </div>

        <!-- Controls box -->
        <div id="controls-panel">
          
          <div class="control-row">
            <button class="btn btn-primary" id="btn-new">New Game</button>
            <button class="btn" id="btn-flip">Flip Board</button>
          </div>

          <div class="control-row controls-col">
            <label for="depth-select" class="label">Engine Difficulty</label>
            <select id="depth-select">
              <option value="3">Level 1 (Fast · 1200 ELO)</option>
              <option value="4">Level 2 (Medium · 1500 ELO)</option>
              <option value="5">Level 3 (Strong · 1700 ELO)</option>
              <option value="6">Level 4 (Slow · 1900 ELO)</option>
            </select>
          </div>
          
        </div>
      </div>

    </div><!-- /.sidebar -->

  </div><!-- /#layout-container -->

  <script src="chess.js"></script>
  <script src="ui.js"></script>
</body>
</html>
