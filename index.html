<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chess Engine</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Loading overlay — shown while WASM module is initialising -->
  <div id="loader">
    <div id="loader-box">
      <div id="spinner"></div>
      <p>Loading WebAssembly engine…</p>
    </div>
  </div>

  <div id="layout-container">
    
    <!-- LEFT: Board Area -->
    <div class="board-area">
      
      <!-- Opponent Banner -->
      <div class="player-banner top-banner">
        <div class="player-icon engine-icon" title="Engine"> </div>
        <div class="player-info">
          <span class="player-name">Engine</span>
          <span class="player-side">(Plays Black)</span>
        </div>
      </div>

      <!-- Board + coordinates wrapper -->
      <div class="board-wrapper">
        <div id="board-outer">
          <!-- Rank labels (left side) -->
          <div id="ranks"></div>

          <!-- The actual chess board squares -->
          <div id="board"></div>
        </div>
        <!-- File labels (bottom) -->
        <div id="files"></div>
      </div>

      <!-- Player Banner -->
      <div class="player-banner bottom-banner">
        <div class="player-icon user-icon" title="Player">👤</div>
        <div class="player-info">
          <span class="player-name">Guest</span>
          <span class="player-side">(You play White)</span>
        </div>
      </div>
    </div>

    <!-- RIGHT: Sidebar Control Panel -->
    <div class="sidebar">
      
      <header>
        <h1>Chess Engine</h1>
        <p id="info">C++ Minimax vs You</p>
      </header>

      <div class="sidebar-content">
        <!-- Status bar -->
        <div id="status-container">
          <div id="status">Initialising…</div>
        </div>

        <!-- Controls box -->
        <div id="controls-panel">
          
          <div class="control-row">
            <button class="btn btn-primary" id="btn-new">New Game</button>
            <button class="btn" id="btn-flip">Flip Board</button>
          </div>

          <div class="control-row controls-col">
            <label for="depth-select" class="label">Engine Difficulty</label>
            <select id="depth-select">
              <option value="3">Level 1 (Fast · ~1200 ELO)</option>
              <option value="4">Level 2 (Medium · ~1500 ELO)</option>
              <option value="5" selected>Level 3 (Strong · ~1700 ELO)</option>
              <option value="6">Level 4 (Slow · ~1900 ELO)</option>
            </select>
          </div>
          
        </div>
      </div>

    </div><!-- /.sidebar -->

  </div><!-- /#layout-container -->

  <script src="chess.js"></script>
  <script src="ui.js"></script>
</body>
</html>
